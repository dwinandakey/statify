[package]
name = "wasm"
version = "0.1.0"
edition = "2021"
description = "K-Medoids Clustering Algorithm for Statify - Rust-Wasm Implementation"
repository = "https://git.stis.ac.id/"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
itertools = "0.14.0"
js-sys = "0.3"
rayon = { version = "1.10.0", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
web-sys = { version = "0.3", features = ["console"] }

getrandom = { version = "0.2.15", features = ["js"] }
# kmedoids 0.5 depends on rand 0.9 → getrandom 0.3; the "wasm_js" feature
# must be enabled for wasm32-unknown-unknown targets (renamed from "js" in 0.3)
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
nalgebra = { version = "0.33.2", features = ["std"] }
ndarray = "0.16.1"
statrs = { version = "0.18.0" }
rand = "0.8"
ordered-float = "4.2"
kmedoids = "0.5"

[features]
default = ["console_error_panic_hook"]
# Enable WebAssembly multi-threading via wasm-bindgen-rayon.
# Build with: RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals"
#             wasm-pack build --target web --features threading -- -Z build-std=panic_abort,std
threading = ["rayon", "wasm-bindgen-rayon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
