services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://backend:5000"
    container_name: statify-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_BACKEND_URL=http://backend:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: statify-backend
    ports:
      - "5000:5000"
    volumes:
      - temp_data:/app/backend/temp
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NEXT_PUBLIC_FRONTEND_URL=https://statify-dev.student.stis.ac.id
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s

volumes:
  temp_data:
